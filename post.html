<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <title>My Blog</title>
  <script>
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="post">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button type="button" class="theme-toggle" aria-label="다크 모드로 전환">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <article id="post" class="post" aria-busy="true">
      <p class="status">글을 불러오는 중…</p>
    </article>
    <nav class="post-nav" aria-label="글 탐색">
      <a href="index.html">← 목록으로</a>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 My Blog</div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
