<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <title>My Blog</title>
  <script>
    try {
      const theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="list">
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button type="button" class="theme-toggle" aria-label="다크 모드로 전환">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <h1 class="intro__title">기록하는 블로그</h1>
      <p class="intro__desc">마크다운으로 쓴 글을 모아 둡니다.</p>
    </section>

    <div class="controls">
      <label class="visually-hidden" for="search">글 검색</label>
      <input id="search" class="search" type="search" placeholder="제목, 태그, 본문으로 검색" autocomplete="off">
      <div id="tag-list" class="tag-list" role="group" aria-label="태그 필터"></div>
    </div>

    <p id="result-count" class="result-count" aria-live="polite">글을 불러오는 중…</p>
    <ul id="post-list" class="post-list"></ul>

    <div id="empty" class="empty" hidden>
      <p>일치하는 글이 없습니다.</p>
      <button type="button" id="reset" class="button">필터 초기화</button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 My Blog</div>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
